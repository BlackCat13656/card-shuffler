<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A JavaScript card shuffler with a Wild West theme."
    />

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap"
      rel="stylesheet"
    />

    <title>Card Shuffler</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="title">Card Shuffler</h1>
      </header>
      <main>
        <div class="card-container">
          <div class="cards">
            <button
              class="card draw-pile"
              type="button"
              aria-label="Draw a card"
            ></button>
            <div class="card discard-pile">Discard</div>
          </div>

          <p class="shuffler-text" aria-live="polite">Click the deck to draw</p>
          <button class="restart-btn" type="button">Restart Shuffle</button>
        </div>
      </main>
      <footer>
        <p class="credits">Built by: Ekan Essien-Udoedi</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
